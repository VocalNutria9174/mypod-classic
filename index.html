<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My iPod</title>
  <meta name="theme-color" content="#1b1b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My iPod">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #1b1b1f; color: #9aa0ad; overflow: hidden; touch-action: none;
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
    }
    /* The iPod has a fixed native size (~311x519, plus reflection). We keep it at that size
       and scale the whole stage with a transform so it always fits the screen. */
    #stage {
      position: fixed; left: 50%; top: 12px; width: 360px; height: 692px;
      transform-origin: 50% 0; transform: translateX(calc(-50% - var(--dx, 0px))) scale(var(--s, 1));
    }
    #stage web-music-ipod { display: block; width: 360px; touch-action: none; }
    #insets { position: fixed; visibility: hidden; pointer-events: none; left: 0; top: 0; width: 0;
              padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    #hint {
      position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 6px);
      text-align: center; pointer-events: none; font-size: 13px; opacity: .85;
    }
    #hint[hidden] { display: none; }
    body.dragging { outline: 3px dashed #3a6df0; outline-offset: -10px; }
  </style>
</head>
<body>
  <div id="insets"></div>
  <div id="stage"><web-music-ipod></web-music-ipod></div>
  <div id="hint" hidden>No music yet &mdash; go to Settings &rarr; Import &rarr; Add Songs</div>

  <!-- order matters: app.js must run before the iPod module (it installs the data shim + menu hooks) -->
  <script src="jsmediatags.min.js"></script>
  <script src="app.js"></script>
  <script type="module" src="web-music-ipod_esm.js"></script>
  <script>
    // Scale + centre the iPod so it always fits. Its native size depends on the viewport, so we
    // measure the real rendered size (at scale 1) instead of assuming one.
    (function () {
      var stage = document.getElementById('stage'), insets = document.getElementById('insets');
      var host = stage.querySelector('web-music-ipod'), observed = null, MARGIN = 12, HINT = 26;   // HINT: strip kept free at the bottom for the first-run hint
      function container() { return host.shadowRoot && host.shadowRoot.querySelector('.ipod-container'); }
      function fit() {
        var el = container(); if (!el) return false;
        stage.style.setProperty('--s', 1); stage.style.setProperty('--dx', '0px'); stage.style.top = '0px';
        var sb = stage.getBoundingClientRect(), b = el.getBoundingClientRect();
        if (!b.width || !b.height) return false;
        var padTop = parseFloat(getComputedStyle(insets).paddingTop) || 0;
        var padBottom = parseFloat(getComputedStyle(insets).paddingBottom) || 0;
        var availH = innerHeight - padTop - padBottom - MARGIN - HINT, availW = innerWidth - 16;
        var s = Math.min(1.3, availH / b.height, availW / b.width);
        var dx = (b.left + b.width / 2) - (sb.left + sb.width / 2);   // iPod centre vs stage centre
        var t0 = b.top - sb.top;                                       // iPod top inside the stage
        var top = padTop + MARGIN + Math.max(0, (availH - b.height * s) / 2) - t0 * s;
        stage.style.setProperty('--s', s.toFixed(4));
        stage.style.setProperty('--dx', (dx * s).toFixed(2) + 'px');
        stage.style.top = top.toFixed(1) + 'px';
        if (observed !== el && window.ResizeObserver) { observed = el; new ResizeObserver(fit).observe(el); }
        return true;
      }
      addEventListener('resize', fit); addEventListener('orientationchange', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      var tries = 0, timer = setInterval(function () { if (fit() || ++tries > 100) clearInterval(timer); }, 50);
    })();
  </script>
</body>
</html>
