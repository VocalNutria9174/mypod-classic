<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My iPod</title>
  <meta name="theme-color" content="#1b1b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My iPod">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #1b1b1f; color: #e8e8ec;
      font: 15px/1.4 system-ui, -apple-system, sans-serif; touch-action: manipulation;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    web-music-ipod { width: min(92vw, 420px); touch-action: none; }
    #panel { width: min(92vw, 420px); display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1; text-align: center; padding: 11px 14px; border-radius: 10px; border: 0;
      background: #3a6df0; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn.secondary { background: #2b2b33; color: #e8e8ec; }
    .btn.danger { background: #5a2330; }
    input[type=text] {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3a44;
      background: #121216; color: inherit; font: inherit;
    }
    #status { min-height: 1.4em; color: #9aa0ad; font-size: 13px; }
    details { background: #232329; border-radius: 10px; padding: 8px 12px; }
    summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
    #tracks { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; touch-action: pan-y; }
    #tracks li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #2f2f38; }
    #tracks .meta { flex: 1; min-width: 0; }
    #tracks .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tracks .a { color: #9aa0ad; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tracks button { background: none; border: 0; color: #ff7a8a; font-size: 18px; cursor: pointer; padding: 4px 8px; }
    body.dragging { outline: 3px dashed #3a6df0; outline-offset: -10px; }
  </style>
</head>
<body>
  <web-music-ipod></web-music-ipod>

  <div id="panel">
    <input id="playlist" type="text" placeholder="Playlist name for this import (optional)">
    <div class="row">
      <label class="btn" for="pick-files">+ Add music</label>
      <label class="btn secondary" for="pick-folder" id="folder-btn" hidden>+ Add folder</label>
    </div>
    <input id="pick-files" type="file" multiple hidden
           accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac">
    <input id="pick-folder" type="file" webkitdirectory multiple hidden>
    <div id="status"></div>
    <details id="library">
      <summary>Library (<span id="count">0</span>)</summary>
      <ul id="tracks"></ul>
      <div class="row" style="margin-top:8px">
        <button class="btn danger" id="clear" type="button">Remove all music</button>
      </div>
    </details>
  </div>

  <!-- order matters: app.js must run before the iPod module so its fetch shim is in place -->
  <script src="jsmediatags.min.js"></script>
  <script src="app.js"></script>
  <script type="module" src="web-music-ipod_esm.js"></script>
</body>
</html>
